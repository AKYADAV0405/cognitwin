<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cognitwin Study Mode</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #FFFFFF;
      color: #0F172A;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #E2E8F0;
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    .title {
      font-size: 14px;
      font-weight: 600;
    }
    .badge {
      font-size: 10px;
      font-family: monospace;
      padding: 2px 6px;
      border-radius: 4px;
      background: #F1F5F9;
      color: #475569;
      border: 1px solid #E2E8F0;
    }
    .card {
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status-text {
      font-size: 12px;
      color: #64748B;
    }
    .status-active {
      color: #059669;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">Cognitwin Study Mode</span>
    <span class="badge">v0.1.0</span>
  </div>
  <div class="card">
    <div class="toggle-row">
      <span class="status-text" id="mode-label">Study Mode: OFF</span>
      <button id="toggle-btn" style="padding: 6px 12px; font-size: 12px; border-radius: 6px; cursor: pointer; border: 1px solid #CBD5E1; background: #0F172A; color: white;">Toggle</button>
    </div>
  </div>
  <script type="module" src="./index.ts"></script>
</body>
</html>
