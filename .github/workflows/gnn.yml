name: GNN-KT CI

on:
  push:
    branches: [main, master, "phase-*/**"]
    paths:
      - "services/gnn_kt/**"
      - ".github/workflows/gnn.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "services/gnn_kt/**"
      - ".github/workflows/gnn.yml"

jobs:
  test-and-lint:
    name: Lint & Smoke Test GNN-KT Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gnn_kt

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: services/gnn_kt/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Linting & Formatting Check
        run: |
          ruff check .
          ruff format --check .

      - name: Run Pytest Smoke Tests
        run: |
          pytest
