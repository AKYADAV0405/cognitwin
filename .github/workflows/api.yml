name: Core API CI

on:
  push:
    branches: [main, master, "phase-*/**"]
    paths:
      - "services/api/**"
      - ".github/workflows/api.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "services/api/**"
      - ".github/workflows/api.yml"

jobs:
  test-and-lint:
    name: Lint & Test FastAPI Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cognitwin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: services/api/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Linting & Formatting Check
        run: |
          ruff check .
          ruff format --check .

      - name: Run Test Suite
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cognitwin_test
          JWT_SECRET_KEY: test-secret-key-32-bytes-long-for-ci
          ENVIRONMENT: test
        run: |
          pytest
